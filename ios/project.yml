# XcodeGen spec. Generates CoHear.xcodeproj from this file.
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# No drag-and-drop, no clicking through New Project. The project is
# reproducible, and Claude Code can regenerate it whenever files change.

name: CoHear

options:
  bundleIdPrefix: com.jingjinglei        # change to your family's or school's domain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 0.9.0

targets:
  CoHear:
    type: application
    platform: iOS
    sources:
      - path: CoHear
        excludes:
          - "Resources/Info.plist.additions.md"
          - "Resources/AppIcon-1024.png"      # lives in the asset catalog instead
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: CoHear/Info.plist
      properties:
        CFBundleDisplayName: CoHear
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "CoHear listens so it can show you what you said. Your voice is processed on this phone and never sent anywhere."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"            # iPhone only for v1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        # Set DEVELOPMENT_TEAM once you have the developer account:
        # DEVELOPMENT_TEAM: XXXXXXXXXX
